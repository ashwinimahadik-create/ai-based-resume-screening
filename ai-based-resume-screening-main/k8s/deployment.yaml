apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-screening
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-screening
  template:
    metadata:
      labels:
        app: resume-screening
    spec:
      containers:
        - name: resume-screening
          image: YOUR_DOCKERHUB_USERNAME/resume-screening:latest
          ports:
            - containerPort: 5000
